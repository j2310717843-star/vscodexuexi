<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>科技工作者建言留言板</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 0;
      background: #f5f5f5;
      font-family: "宋体", Arial, sans-serif;
      font-size: 14px;
    }

    /* 外层DIV：整体浅蓝背景和边框 */
    .board {
      width: 900px;
      margin: 0 auto;
      padding: 18px 28px 24px;
      background: #eef6ff;
      border: 1px solid #b8d0e8;
    }

    /* 头部：左边留言板，右边科技工作者建言 */
    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid #c9dced;
      padding-bottom: 10px;
      margin-bottom: 18px;
    }

    .board-header h1 {
      margin: 0;
      color: #003399;
      font-size: 30px;
      letter-spacing: 2px;
    }

    .board-header span {
      color: #003399;
      font-size: 14px;
    }

    /* 表单表格 */
    .form-table {
      width: 100%;
      border-collapse: collapse;
    }

    .form-table th {
      width: 120px;
      padding: 8px 10px;
      text-align: right;
      font-weight: normal;
      color: #666;
      vertical-align: top;
    }

    .form-table td {
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    /* 红色星号 */
    .req {
      color: #ff0000;
      margin-right: 2px;
    }

    /* 输入框统一风格 */
    .form-table input[type="text"] {
      width: 260px;
      height: 24px;
      border: 1px solid #999;
      padding: 2px 5px;
    }

    .form-table select {
      width: 120px;
      height: 26px;
      border: 1px solid #999;
    }

    .form-table textarea {
      width: 80%;
      height: 120px;
      border: 1px solid #999;
      padding: 5px;
      resize: vertical;
    }

    /* 单选和文字间距 */
    .form-table label {
      margin-right: 12px;
      color: #333;
    }

    /* 分类行里的“科技工作者建言” */
    .category-text {
      margin-right: 15px;
    }

    /* 蓝色注释 */
    .note {
      color: #003399;
      font-size: 13px;
      line-height: 1.7;
      padding-left: 130px !important;
    }

    /* 按钮行 */
    .btn-row {
      text-align: center;
      padding-top: 8px !important;
    }

    .btn-row button {
      width: 70px;
      height: 28px;
      margin: 0 8px;
      border: 1px solid #888;
      background: #f7f7f7;
      cursor: pointer;
    }

    /* 底部声明列表 */
    .rules {
      margin: 18px 0 0 100px;
      padding-left: 20px;
      color: #003399;
      line-height: 1.8;
    }

    .rules li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- DIV 外层布局 -->
  <div class="board">
    <div class="board-header">
      <h1>留言板</h1>
      <span>科技工作者建言</span>
    </div>

    <form action="#" method="post">
      <!-- 表格混合布局 -->
      <table class="form-table">
        <tr>
          <th><span class="req">*</span>姓 名：</th>
          <td><input type="text" name="name"></td>
        </tr>

        <tr>
          <th><span class="req">*</span>电子邮件：</th>
          <td><input type="text" name="email"></td>
        </tr>

        <tr>
          <th>分 类：</th>
          <td>
            <span class="category-text">科技工作者建言</span>

            <label>
              <input type="radio" name="secret" value="0" checked>不保密
            </label>
            <label>
              <input type="radio" name="secret" value="1">保密
            </label>

            留言类型：
            <select name="type">
              <option value="">请选择</option>
              <option value="建议">建议</option>
              <option value="咨询">咨询</option>
              <option value="投诉">投诉</option>
            </select>
          </td>
        </tr>

        <tr>
          <th>留 言：</th>
          <td>
            <textarea name="content"></textarea>
          </td>
        </tr>

        <tr>
          <td colspan="2" class="note">
            注：如果您的留言不便公开，请选择“保密”选项，提交后可凭系统反馈给您的留言编号、查询密码和您的姓名查询回复。
          </td>
        </tr>

        <tr>
          <td colspan="2" class="btn-row">
            <button type="submit">提交</button>
            <button type="reset">清空</button>
          </td>
        </tr>
      </table>

      <ul class="rules">
        <li>请遵守国家有关法律、法规，尊重网上道德，承担一切因您的行为而直接或间接引起的社会责任。</li>
        <li>本网站拥有管理笔名和留言的一切权利。</li>
      </ul>
    </form>
  </div>

</body>
</html>
