<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图书馆读者调查问卷</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 0;
      background: #f2f2f2;
      font-family: "宋体", Arial, sans-serif;
      font-size: 14px;
      color: #333;
    }

    .survey {
      width: 860px;
      margin: 0 auto;
      padding: 25px 35px 30px;
      background: #ffffff;
      border: 1px solid #cccccc;
    }

    .survey h1 {
      margin: 0 0 18px;
      text-align: center;
      color: #003366;
      font-size: 26px;
      letter-spacing: 1px;
    }

    .intro {
      line-height: 1.8;
      text-indent: 2em;
      margin: 0 0 20px;
    }

    /* 问卷表格 */
    .survey-table {
      width: 100%;
      border-collapse: collapse;
    }

    .survey-table th {
      width: 230px;
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
      font-weight: normal;
      line-height: 1.7;
    }

    .survey-table td {
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
      line-height: 1.8;
    }

    /* 下拉框 */
    .survey-table select {
      width: 160px;
      height: 26px;
      border: 1px solid #999;
    }

    /* 单行文本框 */
    .survey-table input[type="text"] {
      width: 220px;
      height: 24px;
      border: 1px solid #999;
      padding: 2px 5px;
    }

    /* 多行文本域 */
    .survey-table textarea {
      width: 500px;
      max-width: 100%;
      height: 75px;
      border: 1px solid #999;
      padding: 5px;
      resize: vertical;
      vertical-align: top;
    }

    /* 单选、复选框与文字间距 */
    .survey-table label {
      display: inline-block;
      margin-right: 18px;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .survey-table input[type="radio"],
    .survey-table input[type="checkbox"] {
      vertical-align: middle;
      margin-right: 3px;
    }

    /* 按钮行 */
    .btn-row {
      text-align: center;
      padding-top: 18px !important;
    }

    .btn-row button {
      width: 90px;
      height: 30px;
      margin: 0 10px;
      border: 1px solid #888;
      background: #f5f5f5;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="survey">
    <h1>图书馆读者调查问卷</h1>

    <p class="intro">
      为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！
    </p>

    <form action="#" method="post">
      <table class="survey-table">
        <tr>
          <th>1. 您的年级</th>
          <td>
            <select name="grade">
              <option value="">请你选择</option>
              <option value="大一">大一</option>
              <option value="大二">大二</option>
              <option value="大三">大三</option>
              <option value="大四">大四</option>
            </select>
          </td>
        </tr>

        <tr>
          <th>2. 您的专业</th>
          <td>
            <input type="text" name="major">
          </td>
        </tr>

        <tr>
          <th>3. 对于图书馆的阅览环境</th>
          <td>
            <label>
              <input type="radio" name="environment" value="满意">满意
            </label>
            <label>
              <input type="radio" name="environment" value="基本满意">基本满意
            </label>
            <label>
              <input type="radio" name="environment" value="不满意">不满意
            </label>

            <br>
            您的建议：
            <br>
            <textarea name="environment_advice"></textarea>
          </td>
        </tr>

        <tr>
          <th>4. 您到图书馆的原因是（可多选）：</th>
          <td>
            <label>
              <input type="checkbox" name="reason" value="借阅专业图书">借阅专业图书
            </label>
            <label>
              <input type="checkbox" name="reason" value="随便坐坐，翻翻书刊">随便坐坐，翻翻书刊
            </label>
            <label>
              <input type="checkbox" name="reason" value="借阅光盘">借阅光盘
            </label>
            <label>
              <input type="checkbox" name="reason" value="参加图书馆组织的活动">参加图书馆组织的活动
            </label>
            <label>
              <input type="checkbox" name="reason" value="自习，复习功课">自习，复习功课
            </label>
            <label>
              <input type="checkbox" name="reason" value="上网">上网
            </label>
            <label>
              <input type="checkbox" name="reason" value="检索电子文献">检索电子文献
            </label>
          </td>
        </tr>

        <tr>
          <th>5. 您到图书馆的频率</th>
          <td>
            <label>
              <input type="radio" name="frequency" value="几乎每天">几乎每天
            </label>
            <label>
              <input type="radio" name="frequency" value="每周1-2次">每周1-2次
            </label>
            <label>
              <input type="radio" name="frequency" value="每月1-2次">每月1-2次
            </label>
            <label>
              <input type="radio" name="frequency" value="几乎不去">几乎不去
            </label>
          </td>
        </tr>

        <tr>
          <th>6. 您对学校的建议</th>
          <td>
            请您提出宝贵建议：
            <br>
            <textarea name="school_advice"></textarea>
          </td>
        </tr>

        <tr>
          <td colspan="2" class="btn-row">
            <button type="submit">提交答案</button>
            <button type="reset">清 空</button>
          </td>
        </tr>
      </table>
    </form>
  </div>

</body>
</html>
